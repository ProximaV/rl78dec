[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rl78dec"
version = "2.0.0"
description = "Native C++17 decompiler and Python scripting SDK for Renesas RL78 / 78K0R firmware (IDA Pro 9.5+)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "zecoxao" }]
keywords = ["rl78", "78k0r", "renesas", "syscon", "ps4", "vita", "decompiler", "ida", "reverse-engineering"]

[project.urls]
Homepage = "https://github.com/zecoxao/rl78dec"

[tool.setuptools]
package-dir = {"" = "python_sdk"}
packages = ["rl78dec"]
py-modules = ["rl78dec_hexrays_bridge"]
